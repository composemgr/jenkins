# nginx proxy address - http://172.17.0.1:64215
name: jenkins
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  app:
    image: jenkins/jenkins:latest
    container_name: jenkins-app
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    tty: true
    stdin_open: true
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: jenkins-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
      JAVA_OPTS: -Djenkins.install.runSetupWizard=true
    healthcheck:
      test: ['CMD', 'curl', '-s', '-o', '/dev/null', '--max-time', '5', 'http://127.0.0.1:8080/']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      - './volumes/data/jenkins:/var/jenkins_home:z'
    ports:
      - '172.17.0.1:64215:8080'
      - '50000:50000'
    networks:
      - jenkins

networks:
  jenkins:
    name: jenkins
    external: false
