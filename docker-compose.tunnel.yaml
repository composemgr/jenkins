name: jenkins
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  app:
    image: jenkins/jenkins:latest
    container_name: jenkins-app
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    tty: true
    stdin_open: true
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: jenkins-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
      JAVA_OPTS: -Djenkins.install.runSetupWizard=true
    ports:
      - '50000:50000'
    volumes:
      - './volumes/data/jenkins:/var/jenkins_home:z'
    labels:
      - 'cloudflare.enable=true'
      - 'cloudflare.service=http://jenkins-app:8080'
      - 'cloudflare.hostname=${BASE_HOST_NAME:-$HOSTNAME}'
    networks:
      - jenkins
      - cloudflare

networks:
  jenkins:
    name: jenkins
    external: false
  cloudflare:
    external: true
